name: Issue Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    name: Sync issue labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Sync managed issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const fs = require("node:fs");
            const managedLabels = JSON.parse(fs.readFileSync(".github/labels.json", "utf8"));
            if (!Array.isArray(managedLabels) || managedLabels.length > 256) throw new Error("Invalid managed labels.");
            const names = new Set();
            for (const label of managedLabels) {
              if (!label || typeof label.name !== "string" || !/^(?:kind|area|provider|os|status|review):[a-z0-9-]+$/.test(label.name) || label.name.length > 50 || names.has(label.name) || typeof label.color !== "string" || !/^[0-9a-fA-F]{6}$/.test(label.color) || typeof label.description !== "string" || label.description.length > 100 || /[\u0000-\u001f\u007f]/.test(label.description)) throw new Error("Invalid managed label definition.");
              names.add(label.name);
            }
            for (const required of ["kind:bug", "kind:feature", "status:triage", "kind:docs", "kind:question"]) {
              if (!names.has(required)) throw new Error("Missing managed replacement label.");
            }

            // Old default labels -> managed replacements. Renaming keeps the
            // label on issues that already have it instead of re-tagging them.
            const renames = [
              ["bug", "kind:bug"],
              ["enhancement", "kind:feature"],
              ["needs-triage", "status:triage"],
              ["documentation", "kind:docs"],
              ["question", "kind:question"],
            ];

            const labelExists = async (name) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                return true;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                return false;
              }
            };

            for (const [oldName, newName] of renames) {
              if (!(await labelExists(oldName))) {
                continue;
              }

              if (await labelExists(newName)) {
                core.warning(`Both '${oldName}' and '${newName}' exist; leaving both unchanged.`);
                continue;
              }

              const def = managedLabels.find((label) => label.name === newName);
              await github.rest.issues.updateLabel({
                owner,
                repo,
                name: oldName,
                new_name: newName,
                color: def.color,
                description: def.description,
              });
              core.info(`Renamed '${oldName}' to '${newName}'.`);
            }

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }
